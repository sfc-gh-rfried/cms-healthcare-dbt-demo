version: 2

sources:
  - name: medicare
    database: SYNTHETIC_HEALTHCARE_DATA__CLINICAL_AND_CLAIMS
    schema: SILVER
    description: "CMS Synthetic Healthcare Data from Snowflake Marketplace"
    tables:
      - name: PATIENTS
        description: "Patient demographics"
        columns:
          - name: PATIENT_ID
            description: "Unique patient identifier"
            data_tests:
              - unique
              - not_null
      - name: PROVIDERS
        description: "Healthcare providers"
        columns:
          - name: PROVIDER_ID
            description: "Unique provider identifier"
            data_tests:
              - unique
              - not_null
      - name: CLAIMS
        description: "Insurance claims. Marketplace snapshot, so freshness is expected to report Stale."
        config:
          loaded_at_field: SERVICEDATE
          freshness:
            warn_after: {count: 1, period: day}
            error_after: {count: 30, period: day}
        columns:
          - name: CLAIM_ID
            description: "Unique claim identifier"
            data_tests:
              - unique
              - not_null
