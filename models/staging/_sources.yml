version: 2

# The seeded tables, declared as a source only so `dbt source freshness` can be demoed.
# No loaded_at_field: Snowflake uses table metadata (last altered), so the badge reads
# Fresh right after `dbt seed`. Models reference the seeds with ref(), not source().
sources:
  - name: demo_raw
    database: "{{ target.database }}"
    schema: "{{ target.schema }}"
    description: "Synthetic seed tables (see seeds/_seeds.yml)"
    config:
      freshness:
        warn_after: {count: 1, period: day}
        error_after: {count: 7, period: day}
    tables:
      - name: raw_claims
      - name: raw_patients
      - name: raw_providers
