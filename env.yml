# Resolved by Snowflake before dbt starts. See
# https://docs.snowflake.com/en/user-guide/data-engineering/dbt-projects-on-snowflake-environment-variables
# Keys must be UPPERCASE and start with DBT_. Account-specific environments (for example a
# locked-down nonprod account) are added from a separate overlay, not committed here.
env_config:
  default_environment: dev
  environments:
    - name: dev
      env:
        # role/warehouse of the caller (plain context functions, as Workspaces requires)
        DBT_CMS_ROLE: "{{ select CURRENT_ROLE() }}"
        DBT_CMS_WH: "{{ select CURRENT_WAREHOUSE() }}"
        DBT_CMS_DB: DBT_CMS_DEMO
        DBT_CMS_SCHEMA: DEV
        # Per-developer isolation: STAGING becomes <USER>_STAGING, etc.
        DBT_CMS_SCHEMA_PREFIX: "{{ select CURRENT_USER() }}"
        DBT_CMS_SINGLE_SCHEMA: "false"
    - name: prod
      env:
        # role/warehouse of the caller (plain context functions, as Workspaces requires)
        DBT_CMS_ROLE: "{{ select CURRENT_ROLE() }}"
        DBT_CMS_WH: "{{ select CURRENT_WAREHOUSE() }}"
        DBT_CMS_DB: DBT_CMS_DEMO
        DBT_CMS_SCHEMA: PROD
        DBT_CMS_SCHEMA_PREFIX: ""
        DBT_CMS_SINGLE_SCHEMA: "false"
    - name: single_schema
      # Everything (seeds, views, tables) in one pre-created schema; no CREATE SCHEMA needed
      env:
        # role/warehouse of the caller (plain context functions, as Workspaces requires)
        DBT_CMS_ROLE: "{{ select CURRENT_ROLE() }}"
        DBT_CMS_WH: "{{ select CURRENT_WAREHOUSE() }}"
        DBT_CMS_DB: DBT_CMS_DEMO
        DBT_CMS_SCHEMA: DBT_SEED_DEMO
        DBT_CMS_SCHEMA_PREFIX: ""
        DBT_CMS_SINGLE_SCHEMA: "true"
