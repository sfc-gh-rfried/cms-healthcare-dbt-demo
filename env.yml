# Resolved by Snowflake before dbt starts. See
# https://docs.snowflake.com/en/user-guide/data-engineering/dbt-projects-on-snowflake-environment-variables
env_config:
  default_environment: dev
  environments:
    - name: dev
      env:
        DBT_CMS_DB: DBT_CMS_DEMO
        DBT_CMS_SCHEMA: DEV
        # Per-developer isolation: STAGING becomes <USER>_STAGING, etc.
        DBT_CMS_SCHEMA_PREFIX: "{{ select CURRENT_USER() }}"
    - name: prod
      env:
        DBT_CMS_DB: DBT_CMS_DEMO
        DBT_CMS_SCHEMA: PROD
        DBT_CMS_SCHEMA_PREFIX: ""
