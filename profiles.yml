cms_demo:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: 'not needed'
      user: 'not needed'
      role: SYSADMIN
      database: "{{ env_var('DBT_CMS_DB', 'DBT_CMS_DEMO') }}"
      warehouse: XSMALL_WH
      schema: "{{ env_var('DBT_CMS_SCHEMA', 'DEV') }}"
      threads: 4
    prod:
      type: snowflake
      account: 'not needed'
      user: 'not needed'
      role: SYSADMIN
      database: "{{ env_var('DBT_CMS_DB', 'DBT_CMS_DEMO') }}"
      warehouse: XSMALL_WH
      schema: "{{ env_var('DBT_CMS_SCHEMA', 'PROD') }}"
      threads: 4
