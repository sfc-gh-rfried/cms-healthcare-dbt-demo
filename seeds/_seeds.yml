version: 2

# Generated by scripts/gen_seeds.py (fully synthetic). Land in the target schema.
seeds:
  - name: raw_patients
    description: "Synthetic patient demographics (200 rows)"
    config:
      column_types:
        BIRTHDATE: date
        DEATHDATE: date
        HEALTHCARE_EXPENSES: number(12,2)
        HEALTHCARE_COVERAGE: number(12,2)
    columns:
      - name: PATIENT_ID
        data_tests: [unique, not_null]

  - name: raw_providers
    description: "Synthetic providers (25 rows)"
    config:
      column_types:
        ENCOUNTERS: number
        PROCEDURES: number
    columns:
      - name: PROVIDER_ID
        data_tests: [unique, not_null]

  - name: raw_claims
    description: "Synthetic claims (1,000 rows, last 90 days before generation)"
    config:
      column_types:
        CLAIM_ID: number
        SECONDARY_PATIENT_INSURANCE_ID: varchar
        DIAGNOSIS1: varchar
        DIAGNOSIS2: varchar
        DIAGNOSIS3: varchar
        DIAGNOSIS4: varchar
        DIAGNOSIS5: varchar
        DIAGNOSIS6: varchar
        DIAGNOSIS7: varchar
        DIAGNOSIS8: varchar
        CURRENTILLNESSDATE: timestamp_ntz
        SERVICEDATE: timestamp_ntz
        STATUS2: varchar
        STATUSP: varchar
        OUTSTANDING1: number(12,2)
        OUTSTANDING2: number(12,2)
        OUTSTANDINGP: number(12,2)
        LASTBILLEDDATE1: timestamp_ntz
        LASTBILLEDDATE2: timestamp_ntz
        LASTBILLEDDATEP: timestamp_ntz
        HEALTHCARECLAIMTYPEID1: number
        HEALTHCARECLAIMTYPEID2: number
    columns:
      - name: CLAIM_ID
        data_tests: [unique, not_null]

  - name: raw_conditions
    description: "Synthetic diagnoses with text descriptions (300 rows); used by the optional Cortex model"
    config:
      column_types:
        START_DATE: date
        STOP_DATE: date
        CODE: varchar
